<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dotxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#dotxGrad)"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Digital Book Silhouette -->
  <g filter="url(#shadow)">
    <!-- Left Book Page -->
    <path d="M120 160 C120 145, 140 140, 240 165 L240 375 C150 350, 120 365, 120 375 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Right Book Page -->
    <path d="M392 160 C392 145, 372 140, 272 165 L272 375 C362 350, 392 365, 392 375 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Center Spine Spine Line -->
    <line x1="256" y1="162" x2="256" y2="378" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Stylized Modern 'X' in Center -->
    <path d="M210 200 L302 330 M302 200 L210 330" stroke="#1d4ed8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Vibrant Cyan 'Dot' representing Dot X -->
    <circle cx="256" cy="140" r="24" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="6" />
    <circle cx="256" cy="140" r="10" fill="#ffffff" />
  </g>

  <!-- Subtitle accent -->
  <circle cx="160" cy="420" r="6" fill="#38bdf8" opacity="0.8"/>
  <circle cx="256" cy="420" r="6" fill="#60a5fa" opacity="0.9"/>
  <circle cx="352" cy="420" r="6" fill="#38bdf8" opacity="0.8"/>
</svg>
